# Patchwork++ (kaancolak/patchwork-plusplus-ros2) para o LIMO Pro com Livox MID-360.
# O no le /livox/lidar e publica /ground e /nonground. Os pontos saem no frame do sensor.
/**:
  ros__parameters:
    use_sim_time: true

    sensor_height: 0.301    # altura do Livox acima do chao (m); a do KITTI era 1.723

    # Ground Plane Fitting
    num_iter: 3             # iteracoes do PCA por patch
    num_lpr: 20             # pontos mais baixos usados como representantes do chao
    num_min_pts: 10         # minimo de pontos para estimar o plano de um patch
    th_seeds: 0.3           # sementes: ate th_seeds acima dos pontos mais baixos
    th_dist: 0.125          # espessura do chao
    th_seeds_v: 0.25
    th_dist_v: 0.1
    max_range: 20.0         # o no le max_range/min_range (o yaml original usa max_r/min_r, ignorados)
    min_range: 2.7          # ponto cego do MID-360 no LIMO: ~2.4 m
    uprightness_thr: 0.707  # normal a ate 45 graus da vertical

    # pontos abaixo de margin * sensor_height (no frame do sensor) nao viram semente
    adaptive_seed_selection_margin: -1.2

    # Concentric Zone Model
    num_zones: 4
    num_sectors_each_zone: [16, 32, 54, 32]
    mum_rings_each_zone: [2, 4, 4, 4]         # "mum" e o nome que o no declara
    elevation_thresholds: [0.0, 0.0, 0.0, 0.0]
    flatness_thresholds: [0.0, 0.0, 0.0, 0.0]

    enable_RNR: true        # na simulacao a intensidade e constante (100): o RNR nao remove nada
    enable_RVPF: true
    enable_TGR: true
    RNR_ver_angle_thr: -15.0
    RNR_intensity_thr: 0.2
